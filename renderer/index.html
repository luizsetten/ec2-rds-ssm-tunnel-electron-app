<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Gerenciador de Conexões</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="tela-home" class="tela">
      <h1>Conexões</h1>
      <div class="home-actions">
        <button onclick="novaConexao()">Nova Conexão</button>
        <button id="login-aws-btn" class="btn-login">🔑 Login AWS</button>
      </div>
      <div id="app-log" class="app-log"></div>
      <div id="db-list"></div>
    </div>

    <div id="tela-nova" class="tela" style="display: none">
      <h2 id="form-title">Nova Conexão</h2>
      <form id="db-form">
        <input type="text" name="name" placeholder="Nome" required />
        <input
          type="text"
          name="instanceId"
          placeholder="EC2 Instance ID"
          required
        />
        <input type="text" name="host" placeholder="Host do RDS" required />
        <input
          type="number"
          name="remotePort"
          placeholder="Porta Remota (RDS)"
          required
        />
        <input
          type="number"
          name="localPort"
          placeholder="Porta Local"
          required
        />
        <select name="profile" required>
          <option value="" disabled selected>Selecione um AWS Profile</option>
        </select>
        <button type="submit">Salvar</button>
      </form>
      <button onclick="abrirTela('home')">Voltar</button>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
